version: '3.8'

name: ul-test

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      N_PRICES: ${N_PRICES:-300000}
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./sql/init_db/schema.sql:/source/schema.sql:ro
      - ./sql/init_db/synthetic.sql:/source/synthetic.sql:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-source.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 240s
    networks: [data]
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-deals_bigdata}
      PGUSER: ${POSTGRES_USER:-test}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      AS_OF: ${AS_OF:-2026-10-26}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-86400}
      MODEL_ITERATIONS: ${MODEL_ITERATIONS:-1000}
      MODEL_THREADS: ${MODEL_THREADS:-4}
      RANDOM_SEED: ${RANDOM_SEED:-42}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

volumes:
  postgres-data:

networks:
  data:
    internal: true